# GrelhaHub — orquestração na VPS (ADR-0006).
#
# A VPS NÃO builda: puxa imagens já construídas pelo pipeline (`docker compose pull`).
# Rollback = trocar IMAGE_TAG e subir de novo.
#
# Segredos vêm do arquivo .env, que existe apenas na VPS e nunca é versionado (RNF-008).
# Template em .env.example.

name: grelhahub

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # RN-GER-005 — a operação ocorre em America/Sao_Paulo; o armazenamento é em UTC.
      TZ: America/Sao_Paulo
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - interna
    # RNF-007 — SEM `ports:`. O banco nunca é exposto publicamente.
    # Acesso administrativo apenas por túnel SSH:
    #   ssh -L 5432:localhost:5432 deploy@vps  (com o túnel apontando para a rede do compose)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Risco RS3 — a VPS é pequena; sem limite, o Postgres sufoca a API.
          memory: 512M

  api:
    image: ${DOCKER_REGISTRY}/grelhahub-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GrelhaHub: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Chave: ${JWT_CHAVE}
      Jwt__Emissor: ${JWT_EMISSOR}
      Jwt__Audiencia: ${JWT_AUDIENCIA}
      TZ: America/Sao_Paulo
    networks:
      - interna
    # Sem `ports:` — quem publica é o nginx.
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ${DOCKER_REGISTRY}/grelhahub-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - interna
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados do Let's Encrypt, emitidos pelo certbot no host.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - interna

networks:
  interna:
    driver: bridge

volumes:
  pgdata:
    # RNF-017 — backup diário deste volume, e sempre antes de apresentação.
  certbot-www:
