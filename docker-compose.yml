# GrelhaHub — orquestração na VPS (ADR-0006).
#
# A VPS NÃO builda: puxa imagens já construídas pelo pipeline (`docker compose pull`).
# Rollback = trocar IMAGE_TAG e subir de novo.
#
# Segredos vêm do .env, que existe apenas na VPS e nunca é versionado (RNF-008).
#
# ────────────────────────────────────────────────────────────────────────────
# ESTA PILHA NÃO PUBLICA NENHUMA PORTA.
#
# A VPS já tem um Traefik na borda servindo outros projetos. Publicar porta aqui
# seria disputar com ele. Em vez disso o nginx interno recebe labels e o Traefik
# o descobre pelo socket do Docker, roteando por domínio e emitindo o certificado.
#
# Sem Traefik no servidor, use o override que publica portas:
#   docker compose -f docker-compose.yml -f docker-compose.exposto.yml up -d
# ────────────────────────────────────────────────────────────────────────────
#
# `name:` isola tudo sob o prefixo `grelhahub`: containers, rede e volumes.

name: grelhahub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # RN-GER-005 — a operação ocorre em America/Sao_Paulo; o armazenamento é em UTC.
      TZ: America/Sao_Paulo
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - interna
    # RNF-007 — o banco nunca é exposto. Acesso administrativo por túnel SSH:
    #   ssh -L 5433:localhost:5432 root@vps
    #   docker compose exec db psql -U grelhahub -d grelhahub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ${DOCKER_REGISTRY}/grelhahub-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GrelhaHub: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Chave: ${JWT_CHAVE}
      Jwt__Emissor: ${JWT_EMISSOR:-grelhahub-api}
      Jwt__Audiencia: ${JWT_AUDIENCIA:-grelhahub-web}
      TZ: America/Sao_Paulo

      # ADR-0015 / SPEC-VEN-002 — raiz das imagens, em volume.
      Arquivos__Raiz: /app/arquivos

      # RN-GER-014 / ADR-0013 — o usuário de suporte da plataforma.
      #
      # ⚠ Sem estas três linhas o `.env` da VPS não chega ao container: o `.env` do compose
      # só substitui `${VAR}` NESTE arquivo, não injeta nada no processo. Foi o que aconteceu
      # até 17/08/2026 — o semeador rodava, não encontrava nada, registrava o aviso 1400 e a
      # instalação seguia SEM nenhum acesso de suporte.
      #
      # `:-` deixa o valor vazio quando a variável não existe: ausência é estado válido
      # (SemeadorDePlataforma avisa e segue), e o compose não reclama de variável indefinida.
      Plataforma__Nome: ${PLATAFORMA_NOME:-Suporte GrelhaHub}
      Plataforma__Email: ${PLATAFORMA_EMAIL:-}
      Plataforma__SenhaInicial: ${PLATAFORMA_SENHA_INICIAL:-}
    volumes:
      # ⚠ A API ESCREVE aqui; o nginx le. É o unico estado da aplicacao fora do banco, e a
      # consequencia esta declarada no ADR-0015: `pg_dump` sozinho DEIXOU de ser backup completo.
      - arquivos:/app/arquivos
    networks:
      - interna
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ${DOCKER_REGISTRY}/grelhahub-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - interna
    # Sobrescreve o healthcheck da imagem, que usa "localhost" e cai no mesmo
    # problema de IPv6. O Dockerfile ja foi corrigido; isto cobre imagens antigas.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # Somente leitura: o nginx serve as imagens e nunca as escreve. Se um dia ele precisar
      # escrever aqui, algo saiu do lugar.
      - arquivos:/var/www/arquivos:ro
    networks:
      - interna
    labels:
      # O Traefik do servidor roda com `exposedbydefault=false`: sem esta linha
      # o container é ignorado, e é assim que os outros projetos ficam isolados.
      traefik.enable: "true"
      # Os dois nomes: existe CNAME www -> apex no DNS, e sem incluir aqui o
      # www daria 404 do Traefik. O Let's Encrypt emite um certificado com os
      # dois SANs automaticamente.
      traefik.http.routers.grelhahub.rule: Host(`${DOMINIO}`) || Host(`www.${DOMINIO}`)
      traefik.http.routers.grelhahub.entrypoints: websecure
      traefik.http.routers.grelhahub.tls.certresolver: letsencrypt
      # A porta é a do container, não a do host — nada é publicado.
      traefik.http.services.grelhahub.loadbalancer.server.port: "80"
    healthcheck:
      # 127.0.0.1 explicito: com "localhost" o BusyBox tenta ::1 primeiro e o
      # nginx escuta so em IPv4 — o healthcheck falha com o servico no ar.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  interna:
    driver: bridge

volumes:
  # ADR-0015 — as imagens de produto e as logos. Precisa entrar na rotina de backup junto com o
  # banco: a partir daqui, `pg_dump` sozinho nao restaura o sistema inteiro.
  #
  #   docker run --rm -v grelhahub_arquivos:/d -v $PWD:/b alpine   #     tar czf /b/arquivos-$(date +%F).tar.gz -C /d .
  arquivos:

  pgdata:
    # RNF-017 — backup antes de qualquer apresentação:
    #   docker compose exec -T db pg_dump -U grelhahub grelhahub | gzip > backup-$(date +%F).sql.gz
