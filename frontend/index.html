<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#FF6B2C" />
    <title>GrelhaHub — ERP completo para restaurantes</title>
    <meta
      name="description"
      content="Cardápio com link próprio, pedido sem aplicativo e o ciclo do pedido no painel da loja. ERP completo para restaurantes e deliveries."
    />
    <meta property="og:title" content="GrelhaHub — ERP completo para restaurantes" />
    <meta
      property="og:description"
      content="O pedido entra pelo link. A comanda sai na chapa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!--
      Design system §2.1 — o tema ANTES da primeira pintura.

      ⚠ Sem este bloco, quem escolheu claro vê a tela ESCURA por um quadro antes de o React
      montar — e o inverso na cozinha, que é pior: um lampejo branco no escuro, a meio metro do
      rosto, no meio do serviço. É o mesmo motivo de a Chapa não usar webfont: o que aparece
      antes de o pacote carregar também é interface.

      ⚠ O conteúdo é o mesmo de `APLICAR_ANTES_DA_PINTURA`, em `services/tema.ts`. Mexeu num,
      mexa no outro — este é o único lugar do produto que roda antes do pacote.
    -->
    <script>
      try {
        var t = localStorage.getItem('grelhahub.tema');
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        /* Modo privado sem storage: cai no tema do sistema, que é o padrão. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
