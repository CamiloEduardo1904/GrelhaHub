# Nginx interno do container `web`.
# O proxy de /api e o TLS ficam no nginx da borda (nginx.conf, na raiz do projeto).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # SPA: qualquer rota desconhecida devolve o index, e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do Vite têm hash no nome — cache agressivo é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # O index NUNCA é cacheado: é ele que aponta para os assets novos após o deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
