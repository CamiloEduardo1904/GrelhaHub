# GrelhaHub — Nginx na VPS (ADR-0006).
#
# Front e back no MESMO domínio: `/` serve o build do React, `/api/*` faz proxy para a API.
# Consequência deliberada: não há CORS em produção (ADR-0003).

# ---------- HTTP: apenas ACME e redirecionamento ----------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMINIO};

    # Desafio do Let's Encrypt precisa continuar acessível em HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMINIO};

    ssl_certificate     /etc/letsencrypt/live/${DOMINIO}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMINIO}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # A versão do nginx não precisa ser anunciada.
    server_tokens off;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API ----------
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # RNF-003 — relatório de 12 meses pode levar até 5 s.
        proxy_read_timeout 60s;
    }

    # ---------- Frontend (SPA) ----------
    location / {
        proxy_pass         http://web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        proxy_pass     http://web:80;
        expires        1y;
        add_header     Cache-Control "public, immutable";
        access_log     off;
    }
}
