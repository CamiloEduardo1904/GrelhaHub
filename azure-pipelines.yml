# GrelhaHub — CI/CD (ADR-0006)
#
# Fluxo: push na main → build e testes → imagem Docker → registry → SSH na VPS →
#        migrations → docker compose pull && up -d
#
# AGENTE: self-hosted, na propria VPS (pool "grelhahub").
#
# Pool dedicado em vez do "Default": nasce autorizado no projeto e isola este
# agente de qualquer outro que a organizacao venha a ter. O "Default" existe no
# nivel da organizacao e exigia autorizacao manual no projeto. A organizacao nao tem
# paralelismo hospedado concedido — a Microsoft nao libera automaticamente desde
# 2021, e o pedido leva dias. O agente proprio e gratuito e sem fila.
#
# Consequencia assumida: o build roda no mesmo servidor que serve producao,
# contrariando a premissa do ADR-0006. A VPS tem 8 GB e 2 vCPU, e o pico dura
# poucos minutos por deploy.
#
# Segredos NUNCA passam por aqui (RNF-008): vivem no /opt/grelhahub/.env da VPS,
# criado uma vez e com permissão 600. O pipeline só precisa de duas Service
# Connections — ver infra/azure-devops.md:
#   grelhahub-registry  (Docker Registry)
#   grelhahub-vps       (SSH)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - assets/**
      - '**/*.md'

pr:
  branches:
    include:
      - main

# Nenhum Variable Group: os segredos vivem no .env da VPS (RNF-008), e o
# pipeline não precisa deles — ele constrói a imagem e manda subir. Declarar um
# grupo que nada usa só criaria mais um passo de configuração para falhar.
variables:
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: dotnetVersion
    value: '10.0.x'

stages:

  # ---------------------------------------------------------------- CI
  - stage: Build
    displayName: Build e testes
    jobs:

      - job: Backend
        displayName: Backend (.NET)
        pool:
          name: grelhahub
        steps:
          - task: UseDotNet@2
            displayName: Instalar SDK .NET
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: true

          - script: dotnet restore
            workingDirectory: backend
            displayName: Restore

          # Release ativa TreatWarningsAsErrors (Directory.Build.props).
          - script: dotnet build -c Release --no-restore
            workingDirectory: backend
            displayName: Build (Release)

          # Os testes de integração sobem PostgreSQL via Testcontainers — o agente
          # hospedado do Azure já tem Docker disponível (ADR-0009).
          - script: dotnet test -c Release --no-build --logger trx --results-directory $(Agent.TempDirectory)/testes
            workingDirectory: backend
            displayName: Testes

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(Agent.TempDirectory)/testes

          # O projeto é avaliado em banca: pacote com CVE conhecido não passa.
          - script: |
              dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt
              if grep -qiE '>\s+\S+\s+\S+\s+\S+\s+(Critical|High)' /tmp/vuln.txt; then
                echo "##vso[task.logissue type=error]Dependência com vulnerabilidade alta ou crítica."
                exit 1
              fi
            workingDirectory: backend
            displayName: Auditoria de dependências

      - job: Frontend
        displayName: Frontend (React)
        pool:
          name: grelhahub
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            workingDirectory: frontend
            displayName: Instalar dependências
          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint
          - script: npm run build
            workingDirectory: frontend
            displayName: Build

  # ---------------------------------------------------------------- Imagens
  - stage: Imagens
    displayName: Publicar imagens
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Docker
        pool:
          name: grelhahub
        steps:
          - task: Docker@2
            displayName: API
            inputs:
              containerRegistry: 'grelhahub-registry'
              repository: 'grelhahub-api'
              command: buildAndPush
              Dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Web
            inputs:
              containerRegistry: 'grelhahub-registry'
              repository: 'grelhahub-web'
              command: buildAndPush
              Dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(imageTag)
                latest

  # ---------------------------------------------------------------- Deploy
  - stage: Deploy
    displayName: Deploy na VPS
    dependsOn: Imagens
    condition: succeeded()
    jobs:
      - deployment: VPS
        environment: producao
        pool:
          name: grelhahub
        strategy:
          runOnce:
            deploy:
              steps:
                # ADR-0006 — migrations como STEP DO PIPELINE, não no startup da API.
                # Migration no startup falha em silêncio ou trava o boot quando dá
                # conflito, e a falha aparece como "a API não sobe".
                - task: SSH@0
                  displayName: Migrations EF Core
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: commands
                    commands: |
                      set -e
                      cd /opt/grelhahub

                      # IMAGE_TAG precisa estar setado JÁ AQUI: sem isso o compose
                      # puxa `latest` e a migration roda a partir da imagem antiga,
                      # aplicando um schema que não corresponde ao código que vai subir.
                      export IMAGE_TAG=$(imageTag)

                      docker compose pull api

                      # ADR-0006 — migration é step do pipeline, nunca no startup.
                      # O modo --migrate aplica e SAI; se falhar, sai com código 1 e
                      # o `set -e` interrompe o deploy antes do `up -d`.
                      docker compose run --rm api dotnet GrelhaHub.Api.dll --migrate

                - task: SSH@0
                  displayName: Subir serviços
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: commands
                    commands: |
                      set -e
                      cd /opt/grelhahub
                      export IMAGE_TAG=$(imageTag)

                      # Grava a tag no .env para que um `docker compose up` manual na
                      # VPS não volte silenciosamente para `latest`.
                      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$(imageTag)|" .env

                      docker compose pull
                      docker compose up -d --remove-orphans
                      # `docker image prune -f` sem filtro apaga imagem dangling de
                      # QUALQUER projeto que rode nesta VPS, inclusive de outro
                      # time no meio de um build. Limitado às nossas.
                      docker image ls "${DOCKER_REGISTRY}/grelhahub-*"                         --filter "dangling=true" -q | xargs -r docker rmi || true

                - task: SSH@0
                  displayName: Verificar saúde
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: commands
                    commands: |
                      for i in $(seq 1 20); do
                        if curl -fsS http://localhost/api/health > /dev/null; then
                          echo "API respondendo."
                          exit 0
                        fi
                        sleep 3
                      done
                      echo "API não respondeu após 60s."
                      cd /opt/grelhahub && docker compose logs --tail=50 api
                      exit 1
