# GrelhaHub — CI/CD (ADR-0006)
#
# Fluxo: push na main → build e testes → imagem Docker → registry → SSH na VPS →
#        migrations → docker compose pull && up -d
#
# AGENTE: self-hosted, na propria VPS (pool "grelhahub").
#
# Pool dedicado em vez do "Default": nasce autorizado no projeto e isola este
# agente de qualquer outro que a organizacao venha a ter. O "Default" existe no
# nivel da organizacao e exigia autorizacao manual no projeto. A organizacao nao tem
# paralelismo hospedado concedido — a Microsoft nao libera automaticamente desde
# 2021, e o pedido leva dias. O agente proprio e gratuito e sem fila.
#
# Consequencia assumida: o build roda no mesmo servidor que serve producao,
# contrariando a premissa do ADR-0006. A VPS tem 8 GB e 2 vCPU, e o pico dura
# poucos minutos por deploy.
#
# Segredos NUNCA passam por aqui (RNF-008): vivem no /opt/grelhahub/.env da VPS,
# criado uma vez e com permissão 600. O pipeline só precisa de duas Service
# Connections — ver infra/azure-devops.md:
#   grelhahub-registry  (Docker Registry)
#   grelhahub-vps       (SSH)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - assets/**
      - '**/*.md'

pr:
  branches:
    include:
      - main

# Nenhum Variable Group: os segredos vivem no .env da VPS (RNF-008), e o
# pipeline não precisa deles — ele constrói a imagem e manda subir. Declarar um
# grupo que nada usa só criaria mais um passo de configuração para falhar.
variables:
  # O Docker@2 NAO insere o Docker ID sozinho: o `repository:` vai literal para
  # o `docker build -t`. Sem o namespace, a imagem sai como `grelhahub-api` e o
  # push mira `library/grelhahub-api` — o espaco das imagens oficiais, onde
  # ninguem tem permissao. O erro que aparece e `insufficient_scope`, que parece
  # problema de token e nao e.
  #
  # Precisa casar com DOCKER_REGISTRY no .env da VPS (docker.io/dextter).
  - name: dockerNamespace
    value: dextter

  - name: imageTag
    value: '$(Build.BuildId)'
  - name: dotnetVersion
    value: '10.0.x'

stages:

  # ---------------------------------------------------------------- CI
  - stage: Build
    displayName: Build e testes
    jobs:

      - job: Backend
        displayName: Backend (.NET)
        pool:
          name: grelhahub
        steps:
          - task: UseDotNet@2
            displayName: Instalar SDK .NET
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: true

          - script: dotnet restore
            workingDirectory: backend
            displayName: Restore

          # Release ativa TreatWarningsAsErrors (Directory.Build.props).
          - script: dotnet build -c Release --no-restore
            workingDirectory: backend
            displayName: Build (Release)

          # Os testes de integração sobem PostgreSQL via Testcontainers (ADR-0009).
          #
          # O agente e SELF-HOSTED na VPS, roda como usuario `azagent` e esta no grupo
          # `docker` — a mesma permissao que o build de imagem ja usa. E o que faz o
          # Testcontainers alcancar /var/run/docker.sock.
          #
          # Este passo existe para que a falta de Docker apareca como "Docker
          # indisponivel" e nao como 16 testes falhando por timeout de conexao, que
          # manda o proximo a investigar procurar defeito no lugar errado.
          - script: |
              if ! docker info > /dev/null 2>&1; then
                echo "##vso[task.logissue type=error]Docker inacessivel para o usuario do agente. Os testes de integracao (ADR-0009) exigem o daemon. Confira se o usuario esta no grupo docker."
                exit 1
              fi

              # Pre-baixa a imagem: no primeiro run da VPS o pull concorre com o
              # timeout de partida do Testcontainers e o teste falha por infra, nao
              # por regra. A versao casa com AmbienteDeIntegracao.
              docker pull --quiet postgres:16-alpine
            displayName: Verificar Docker para os testes de integração

          - script: dotnet test -c Release --no-build --logger trx --results-directory $(Agent.TempDirectory)/testes
            workingDirectory: backend
            displayName: Testes

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(Agent.TempDirectory)/testes

          # O projeto é avaliado em banca: pacote com CVE conhecido não passa.
          - script: |
              dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt
              if grep -qiE '>\s+\S+\s+\S+\s+\S+\s+(Critical|High)' /tmp/vuln.txt; then
                echo "##vso[task.logissue type=error]Dependência com vulnerabilidade alta ou crítica."
                exit 1
              fi
            workingDirectory: backend
            displayName: Auditoria de dependências

      - job: Frontend
        displayName: Frontend (React)
        pool:
          name: grelhahub
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            workingDirectory: frontend
            displayName: Instalar dependências
          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint
          - script: npm run build
            workingDirectory: frontend
            displayName: Build

  # ---------------------------------------------------------------- Imagens
  - stage: Imagens
    displayName: Publicar imagens
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Docker
        pool:
          name: grelhahub
        steps:
          - task: Docker@2
            displayName: API
            inputs:
              containerRegistry: 'grelhahub-registry'
              repository: '$(dockerNamespace)/grelhahub-api'
              command: buildAndPush
              Dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Web
            inputs:
              containerRegistry: 'grelhahub-registry'
              repository: '$(dockerNamespace)/grelhahub-web'
              command: buildAndPush
              Dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(imageTag)
                latest

  # ---------------------------------------------------------------- Deploy
  - stage: Deploy
    displayName: Deploy na VPS
    dependsOn: Imagens
    condition: succeeded()
    jobs:
      - deployment: VPS
        environment: producao
        pool:
          name: grelhahub
        strategy:
          runOnce:
            deploy:
              steps:
                # Job de deployment NAO faz checkout sozinho. Sem isto, o passo
                # de sincronizacao nao teria o que copiar.
                - checkout: self

                # O compose e o infra/ precisam vir do repositorio a cada deploy.
                # Antes eram colocados na VPS a mao: qualquer mudanca versionada
                # ficava so no git, o servidor seguia com a copia velha, e a
                # divergencia apareceria como comportamento inexplicavel.
                #
                # O .env NUNCA e enviado daqui: vive so na VPS (RNF-008).
                - task: CopyFilesOverSSH@0
                  displayName: Sincronizar compose e infra
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    sourceFolder: '$(Build.SourcesDirectory)'
                    contents: |
                      docker-compose.yml
                      docker-compose.exposto.yml
                      infra/**
                    targetFolder: '/opt/grelhahub'
                    overwrite: true

                # ADR-0006 — migrations como STEP DO PIPELINE, nao no startup da
                # API: migration no startup falha em silencio ou trava o boot
                # quando da conflito, e a falha aparece como "a API nao sobe".
                #
                # runOptions: inline, e nao commands. Com "commands" a task roda
                # CADA LINHA como um comando separado — o cd morre com o
                # processo e o comando seguinte executa em /root.
                - task: SSH@0
                  displayName: Migrations EF Core
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: inline
                    failOnStdErr: false
                    inline: |
                      set -e

                      # O `docker compose` escreve TODO o progresso no stderr —
                      # "Pulling", "Pulled", "Container Created", "Healthy". A task
                      # SSH marca cada linha de stderr como erro no log, e um deploy
                      # que deu certo termina com uma dezena de erros vermelhos que
                      # nao sao erros. Isso e pior que feio: quando aparecer um erro
                      # DE VERDADE, ele vai estar no meio de dez falsos.
                      #
                      # `exec 2>&1` manda o stderr do script e de tudo que ele chama
                      # para o stdout, de uma vez, e cobre os comandos que vierem
                      # depois sem precisar lembrar do redirecionamento em cada um.
                      #
                      # Nao se perde deteccao de falha: o gate e o CODIGO DE SAIDA
                      # com `set -e`, nunca o stderr — `failOnStdErr` esta false
                      # exatamente porque stderr aqui e ruido, nao sinal.
                      exec 2>&1

                      cd /opt/grelhahub

                      # IMAGE_TAG setado JA AQUI: sem isso o compose puxa a tag
                      # latest e a migration roda a partir da imagem antiga,
                      # aplicando um schema que nao corresponde ao codigo.
                      export IMAGE_TAG=$(imageTag)

                      docker compose pull --quiet api

                      # O modo --migrate aplica e SAI. Se falhar, sai com codigo
                      # 1 e o "set -e" interrompe o deploy antes do up -d.
                      docker compose run --rm api dotnet GrelhaHub.Api.dll --migrate

                # RN-GER-014 / ADR-0013 — o usuario de suporte da plataforma.
                #
                # Step PROPRIO, e nao um apendice do step de migrations, porque o
                # desfecho dele precisa ser lido: idempotente, o caso comum e "ja
                # existe", e quando NAO existe o motivo esta neste log e em lugar
                # nenhum mais — a tela de login nao pode contar (RN-GER-027).
                #
                # As tres variaveis vem do .env da VPS (RNF-008), repassadas pelo
                # bloco environment do servico api em docker-compose.yml. Ausencia
                # e estado valido: o semeador avisa e sai com 0, e a instalacao
                # segue sem acesso de suporte.
                - task: SSH@0
                  displayName: Semear plataforma
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: inline
                    failOnStdErr: false
                    inline: |
                      set -e
                      exec 2>&1   # progresso do compose e stderr — ver step de migrations

                      cd /opt/grelhahub
                      export IMAGE_TAG=$(imageTag)

                      docker compose run --rm api dotnet GrelhaHub.Api.dll --semear

                - task: SSH@0
                  displayName: Subir servicos
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: inline
                    failOnStdErr: false
                    inline: |
                      set -e
                      exec 2>&1   # progresso do compose e stderr — ver step de migrations

                      cd /opt/grelhahub
                      export IMAGE_TAG=$(imageTag)

                      # Grava a tag no .env para que um "docker compose up"
                      # manual na VPS nao volte silenciosamente para latest.
                      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$(imageTag)|" .env

                      docker compose pull --quiet
                      docker compose up -d --remove-orphans

                      # Limpeza restrita as NOSSAS imagens antigas. Um
                      # "docker image prune -f" sem filtro apagaria imagem
                      # dangling de qualquer projeto que rode nesta VPS — e
                      # tambem o postgres:16-alpine e o testcontainers/ryuk que
                      # a etapa de testes usa, fazendo o proximo run baixar tudo
                      # de novo e ficar sujeito a timeout de partida.
                      # NAO troque o filtro por prune sem filtro.
                      docker image ls --format "{{.Repository}}:{{.Tag}}" \
                        | grep "grelhahub-" \
                        | grep -v ":$(imageTag)$" \
                        | grep -v ":latest$" \
                        | xargs -r docker rmi 2>/dev/null || true

                - task: SSH@0
                  displayName: Verificar saude
                  inputs:
                    sshEndpoint: 'grelhahub-vps'
                    runOptions: inline
                    failOnStdErr: false
                    inline: |
                      exec 2>&1   # progresso do compose e stderr — ver step de migrations

                      cd /opt/grelhahub

                      # A API nao publica porta: o teste sai de dentro do nginx,
                      # que e quem alcanca a rede interna da pilha.
                      for i in $(seq 1 20); do
                        if docker compose exec -T nginx wget -q -O- http://127.0.0.1/api/health > /dev/null 2>&1; then
                          echo "API respondendo."
                          docker compose ps
                          exit 0
                        fi
                        sleep 3
                      done

                      echo "API nao respondeu apos 60s."
                      docker compose ps
                      docker compose logs --tail=50 api
                      exit 1
