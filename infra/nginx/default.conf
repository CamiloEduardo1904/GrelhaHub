# Nginx interno do GrelhaHub.
#
# NÃO é o nginx da borda. Nesta VPS quem termina TLS e roteia por domínio é o
# Traefik, que já existe e serve outros projetos (ADR-0006, revisão de 17/08).
#
# O papel daqui é único e continua valendo: manter front e API na MESMA origem,
# `/` e `/api/*`, para que não exista CORS (ADR-0003). Por isso ele permanece,
# mesmo com um proxy na frente.
#
# `server_name _` aceita qualquer Host: quem decide o domínio é o Traefik, pelo
# label. Amarrar o nome aqui só criaria um segundo lugar para errar.

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Confia no cabeçalho que o Traefik envia — sem isto a API acha que toda
    # requisição é HTTP e monta URL errada em redirecionamento.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # RNF-003 — relatório de 12 meses pode levar até 5 s.
        proxy_read_timeout 60s;
    }

    # ADR-0015 / SPEC-VEN-002 — as imagens do cardapio.
    #
    # Servidas AQUI, como estatico, e nao proxeadas para a API: e o que o ADR-0015 decidiu, e o
    # nginx faz isto melhor do que o pipeline do ASP.NET faria. A API tambem sabe servi-las
    # (UseStaticFiles), mas isso existe para desenvolvimento e para o teste de integracao, que
    # sobe sem nginx na frente.
    #
    # NAO HA interpretador atras deste diretorio. E a segunda metade da defesa de RN-VEN-042: a
    # primeira e conferir a assinatura do arquivo antes de gravar; a segunda e o diretorio onde
    # ele cai nao executar nada, mesmo que algo indevido chegue la por outro caminho.
    location /arquivos/ {
        alias /var/www/arquivos/;

        # O nome do arquivo e gerado pelo sistema (UUID) e o conteudo de um caminho nunca muda:
        # trocar a imagem gera caminho novo. Da para cachear longe sem risco de servir foto velha.
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";

        # Nada de listagem: o diretorio e publico para LEITURA de arquivo conhecido, nao para
        # enumeracao do que cada restaurante subiu.
        autoindex off;

        # Somente os tipos que RN-VEN-042 aceita chegam aqui, mas o `try_files` garante 404 limpo
        # em vez de erro do nginx quando o caminho nao existe.
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
